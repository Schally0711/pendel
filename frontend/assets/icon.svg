<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#14b8a6"/>
			<stop offset="1" stop-color="#0f766e"/>
		</linearGradient>
	</defs>
	<rect width="512" height="512" fill="url(#bg)"/>
	<g id="motif">
	<!-- swing arc -->
	<path d="M167 329 A 210 210 0 0 0 345 329" fill="none" stroke="#99f6e4" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34" opacity=".9"/>
	<!-- pivot bar -->
	<rect x="176" y="128" width="160" height="22" rx="11" fill="#ccfbf1"/>
	<!-- rod -->
	<path d="M256 139 L 296 318" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
	<!-- bob -->
	<circle cx="302" cy="344" r="46" fill="#fff"/>
	<circle cx="302" cy="344" r="18" fill="#14b8a6"/>
	</g>
</svg>
