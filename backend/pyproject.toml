[project]
name = "pendel"
version = "0.5.0"
description = "Work time tracking for home office and office days, including commute tracking"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "argon2-cffi>=25.1",
    "holidays>=0.106",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pendel*"]

[tool.setuptools.package-data]
pendel = ["migrations/script.py.mako", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["pendel/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
