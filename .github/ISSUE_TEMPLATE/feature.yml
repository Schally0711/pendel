name: Idee / Feature request
description: Vorschlag für eine neue Funktion / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden? / What problem should it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Wie stellst du dir die Lösung vor? / Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen / alternatives
